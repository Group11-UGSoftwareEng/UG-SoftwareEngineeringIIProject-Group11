# label for your workflow — it appears in the Actions tab on GitHub
name: CI - Build and Test

# When to run the workflow - the triger
on:
  push:   #Run when someone pushes to the main branch.
    branches: # specify whichever branches you want to trigger the workflow
      - 'feature/**'
      - main
  pull_request: #Run when a pull request is opened against the main branch.
    branches: [ main ]

# Define the jobs to be run in this workflow
jobs:
  build:  # Define a job named "build"
    runs-on: ubuntu-latest 
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: expenses_tracker_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
 # The type of runner to run the job on. Other options include windows-latest, macos-latest, etc.

    steps:
      # Step 1: Check out your code
      - name: Checkout repository #steps can have names to make them easier to identify
        uses: actions/checkout@v7  # This action checks out your repository under $GITHUB_WORKSPACE, so your job can access it

      # Step 2: Set up Java (for Spring)
      - name: Set up JDK 21
        uses: actions/setup-java@v4  # This action sets up a Java Development Kit (JDK) environment for use in actions by downloading and installing the specified version of Java.
        with:
          distribution: temurin # Use the Eclipse Temurin distribution of Java
          java-version: 21      # Specify the Java version to use

      # Step 3: Build and run tests
      - name: Run unit tests
        run: mvn -B -f backend/pom.xml test "-Dtest=EditCategoryDetailsUseCaseTest"

      - name: Run integration tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/expenses_tracker_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: mvn -B -f backend/pom.xml test "-Dtest=EditCategoryPersistenceIT,Group11ExpensesTrackerApplicationTests"

      - name: Build backend
        run: mvn -B -f backend/pom.xml package -DskipTests # Use Maven to clean the project and run tests in batch mode (-B)


  # Log in to GitHub Container Registry
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/group11-ugsoftwareeng/expensestracker:latest ./backend


    # Push image
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' # will push only when the push is on main
        run: docker push ghcr.io/group11-ugsoftwareeng/expensestracker:latest


  deploy:
    needs: build # build must succeed
    runs-on: ubuntu-latest  # The type of runner to run the job on. Other options include windows-latest, macos-latest, etc.

    steps:
      
      # Trigger Render deploy (optional)
      - name: Deploy to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' # deploy happens only on push to main
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
